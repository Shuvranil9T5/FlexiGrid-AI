services:
  - type: web
    name: flexigrid-ai-api-shuvranil9t5
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ALLOWED_ORIGINS
        value: https://flexigrid-ai-shuvranil9t5.onrender.com

  - type: web
    name: flexigrid-ai-shuvranil9t5
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://flexigrid-ai-api-shuvranil9t5.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
